services:
  server:
    image: ghcr.io/arnabmitra/tasty-links:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    container_name: tasty-links
    restart: unless-stopped
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tasty-links.rule=Host(`YOUR_DOMAIN_HERE`)"
      - "traefik.http.routers.tasty-links.entrypoints=websecure"
      - "traefik.http.routers.tasty-links.tls.certresolver=myresolver"
    networks:
      - web

  # Traefik v3 Reverse Proxy with automatic Let's Encrypt SSL
  # (If you already have Traefik running on Liquid Web from eth-tx-lookup,
  # you can comment out this service and connect to the shared network).
  reverse-proxy:
    image: traefik:v3.1
    container_name: traefik-reverse-proxy
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=amitra@maxpain.site"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - web

volumes:
  letsencrypt:

networks:
  web:
    driver: bridge
